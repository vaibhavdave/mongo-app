services:
  mongodb:
    image: mongo:7.0
    container_name: capstone-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - capstone_mongo_data:/data/db
    healthcheck:
      test: echo "db.adminCommand('ping')" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Both transactions (order placement) and change streams (the live
  # order feed) require a replica set, even a single-node one - a plain
  # standalone mongod supports neither. This one-shot container runs
  # rs.initiate() once, then exits.
  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./mongo-init:/mongo-init
    command: >
      mongosh --host mongodb:27017 /mongo-init/init-replica-set.js
    restart: "no"

  mongo-express:
    image: mongo-express:1.0
    container_name: capstone-mongo-express
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    restart: unless-stopped

volumes:
  capstone_mongo_data:
